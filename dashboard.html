<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CipherMind — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .welcome{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: var(--ink); text-align:center; padding: 32px;
  }
  .welcome h1{ font-family: var(--font-mono); color: var(--text); letter-spacing:1px; }
  .welcome h1 span{ color: var(--brass-hi); }
  .welcome p{ color: var(--text-dim); font-family: var(--font-mono); font-size: 13px; }
  .welcome .btn{ margin-top: 24px; text-decoration:none; display:inline-flex; }
</style>
</head>
<body>
  <div class="welcome">
    <h1>Session <span>decrypted</span>.</h1>
    <p id="who">Loading identity…</p>
    <button class="btn btn--primary" id="logout">Sign out</button>
  </div>

  <script>
    const raw = sessionStorage.getItem("ciphermind_user");
    const who = document.getElementById("who");
    if (raw){
      const user = JSON.parse(raw);
      who.textContent = `Welcome, ${user.name} (${user.email})`;
    } else {
      who.textContent = "No active session — redirecting to sign in…";
      setTimeout(() => window.location.href = "index.html", 1200);
    }
    document.getElementById("logout").addEventListener("click", () => {
      sessionStorage.removeItem("ciphermind_user");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
